name: Update data

on:
  schedule:
    # Weekdays at 23:00 UTC (6 or 7 pm in Toronto), after the Bank of Canada publishes.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests before publishing
        run: python -m pytest -q
      - name: Run pipeline (one Valet API request)
        run: python -m pipeline.run
        env:
          # Optional. Without it the rule-based summary is used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data.json ($(date -u +%F))"
          git push
